; Example Supervisor config for the Laravel queue worker that processes
; ProcessImportBatchJob (and any future queued job). Nothing dispatches
; `queue:work` on its own — without a process like this running, jobs sit
; in the `jobs` table forever with status stuck at "queued".
;
; Install (run on the server, review paths first):
;   sudo cp deploy/queue-worker.supervisor.conf /etc/supervisor/conf.d/laravel-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-worker:*
;
; After every deploy that changes queued-job code, reload workers so they
; pick up the new code instead of running a stale copy:
;   php artisan queue:restart

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/laravel-api/artisan queue:work database --queue=default --tries=3 --timeout=600 --sleep=3
directory=/var/www/laravel-api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/laravel-api/storage/logs/queue-worker.log
stopwaitsecs=630
